# ===================================================================
# CONFIGURACION DE LA APLICACION
# ===================================================================
spring.application.name=mi-proyecto-api
server.port=8080
# Render esta detras de un proxy: usar la IP real del cliente (X-Forwarded-For)
server.forward-headers-strategy=native

# Comprimir con gzip las respuestas JSON de mas de 1 KB (las listas).
# OkHttp en la app pide y descomprime gzip solo: no requiere cambios en el cliente.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# ===================================================================
# ACTUATOR
# ===================================================================
# Solo /actuator/health, publico y sin detalles: {"status":"UP"} o {"status":"DOWN"}.
# Incluye la comprobacion de la base de datos. Lo usara Render para saber si el servicio esta vivo.
management.endpoints.web.exposure.include=health
# Sin la pagina indice /actuator (lista de enlaces): nadie la necesita
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# ===================================================================
# CONFIGURACION DE LA BASE DE DATOS (SUPABASE)
# ===================================================================
# Las credenciales NUNCA van en este archivo: se leen de variables de entorno.
# En Render: DB_URL, DB_USERNAME y DB_PASSWORD.
# En local: ver config/application-local.properties.example
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURACION DE HIBERNATE / JPA
# ===================================================================
# Dialecto especifico para optimizar las consultas en PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ddl-auto controla como se crean las tablas basadas en tus entidades de Java:
# - 'update': Crea o modifica las tablas automaticamente si hay cambios (ideal para desarrollo).
# - 'none' o 'validate': No toca la base de datos (obligatorio en produccion).
spring.jpa.hibernate.ddl-auto=update

# No mostrar el SQL en produccion (se puede activar en el perfil local)
spring.jpa.show-sql=false

# La conexion a la base se libera al terminar el servicio, no al terminar la peticion HTTP.
# Los datos que necesita cada DTO se cargan en la consulta (ver @EntityGraph en los repositorios).
spring.jpa.open-in-view=false

# ===================================================================
# CONFIGURACION DEL POOL DE CONEXIONES (HIKARI)
# ===================================================================
# Pensado para el pooler de Supabase en modo sesion (puerto 5432), plan gratuito:
# cada conexion de Hikari ocupa una conexion del pooler, que tiene un limite bajo.
# - Hasta 5 conexiones: suficiente para una sola instancia en Render (0,1 CPU).
# - Solo 1 abierta en reposo: no acaparar conexiones de Supabase sin uso.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
# Cerrar conexiones extra tras 5 minutos sin uso
spring.datasource.hikari.idle-timeout=300000
# Cada 4 minutos se hace un ping a las conexiones inactivas, para que Supabase
# no las corte y la siguiente peticion no tenga que reconectar (debe ser menor que max-lifetime)
spring.datasource.hikari.keepalive-time=240000
# Renovar cada conexion a los 20 minutos, antes de que la cierre el pooler
spring.datasource.hikari.max-lifetime=1200000
# Esperar hasta 20 s por una conexion (la base puede tardar en responder tras un arranque en frio)
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# SEGURIDAD
# ===================================================================
# Secreto para firmar los JWT (minimo 32 caracteres). Obligatorio: sin el la app no arranca.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracion-horas=${JWT_EXPIRACION_HORAS:8}

# false = modo transicion: se aceptan peticiones sin token (app antigua),
#         pero si llega un token se valida y se aplican los permisos.
# true  = toda la API exige token.
app.security.enforce=${SECURITY_ENFORCE:false}

# Origenes permitidos para CORS separados por coma.
# Vacio = ninguno (la app movil no lo necesita; sirve para el futuro panel web).
app.cors.origins=${CORS_ORIGINS:}

# Intentos fallidos de login permitidos por IP y usuario dentro de la ventana
app.login.max-intentos=5
app.login.ventana-segundos=60

# ===================================================================
# RESERVAS
# ===================================================================
# Horas que ocupa cada reserva desde su hora de inicio (entre 1 y 24).
# Dos reservas de la misma zona chocan si sus bloques se cruzan.
app.reservas.duracion-horas=${RESERVAS_DURACION_HORAS:2}
# Zona horaria del conjunto para decidir si una fecha/hora ya pasó
app.zona-horaria=America/Bogota

# Swagger solo si se habilita explicitamente (desactivado en produccion)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
