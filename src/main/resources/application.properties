# ===================================================================
# CONFIGURACION DE LA APLICACION
# ===================================================================
spring.application.name=mi-proyecto-api
server.port=8080
# Render esta detras de un proxy: usar la IP real del cliente (X-Forwarded-For)
server.forward-headers-strategy=native

# ===================================================================
# CONFIGURACION DE LA BASE DE DATOS (SUPABASE)
# ===================================================================
# Las credenciales NUNCA van en este archivo: se leen de variables de entorno.
# En Render: DB_URL, DB_USERNAME y DB_PASSWORD.
# En local: ver config/application-local.properties.example
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURACION DE HIBERNATE / JPA
# ===================================================================
# Dialecto especifico para optimizar las consultas en PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ddl-auto controla como se crean las tablas basadas en tus entidades de Java:
# - 'update': Crea o modifica las tablas automaticamente si hay cambios (ideal para desarrollo).
# - 'none' o 'validate': No toca la base de datos (obligatorio en produccion).
spring.jpa.hibernate.ddl-auto=update

# No mostrar el SQL en produccion (se puede activar en el perfil local)
spring.jpa.show-sql=false

# La conexion a la base se libera al terminar el servicio, no al terminar la peticion HTTP.
# Los datos que necesita cada DTO se cargan en la consulta (ver @EntityGraph en los repositorios).
spring.jpa.open-in-view=false

# ===================================================================
# CONFIGURACION DEL POOL DE CONEXIONES (HIKARI)
# ===================================================================
# Configuracion recomendada para evitar caidas de conexion con Supabase Pooler
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===================================================================
# SEGURIDAD
# ===================================================================
# Secreto para firmar los JWT (minimo 32 caracteres). Obligatorio: sin el la app no arranca.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracion-horas=${JWT_EXPIRACION_HORAS:8}

# false = modo transicion: se aceptan peticiones sin token (app antigua),
#         pero si llega un token se valida y se aplican los permisos.
# true  = toda la API exige token.
app.security.enforce=${SECURITY_ENFORCE:false}

# Origenes permitidos para CORS separados por coma.
# Vacio = ninguno (la app movil no lo necesita; sirve para el futuro panel web).
app.cors.origins=${CORS_ORIGINS:}

# Intentos fallidos de login permitidos por IP y usuario dentro de la ventana
app.login.max-intentos=5
app.login.ventana-segundos=60

# ===================================================================
# RESERVAS
# ===================================================================
# Horas que ocupa cada reserva desde su hora de inicio (entre 1 y 24).
# Dos reservas de la misma zona chocan si sus bloques se cruzan.
app.reservas.duracion-horas=${RESERVAS_DURACION_HORAS:2}
# Zona horaria del conjunto para decidir si una fecha/hora ya pasó
app.zona-horaria=America/Bogota

# Swagger solo si se habilita explicitamente (desactivado en produccion)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
