# ===================================================================
# PERFIL DEMO - solo para desarrollo local
# ===================================================================
# Arranca sin Supabase: base H2 en memoria con datos de ejemplo (ver config/DatosDemo.java).
# Los datos se pierden al apagar el servidor.
#
#   java -jar target/residencial-0.0.1-SNAPSHOT.jar --spring.profiles.active=demo
#
# Desde el emulador de Android el backend se ve en http://10.0.2.2:8080
# NUNCA activar este perfil en Render.
# ===================================================================
spring.datasource.url=jdbc:h2:mem:demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# H2 en memoria: Hibernate crea las tablas desde las entidades; las migraciones son para Postgres
spring.flyway.enabled=false

# Secreto solo para pruebas locales: los tokens de este perfil no sirven en produccion
app.jwt.secret=solo-para-demo-local-no-usar-en-produccion-2026
# Igual que la fase C de P0: toda la API exige token
app.security.enforce=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
