# Configuracion de tests: base de datos H2 en memoria, nunca la de Supabase
spring.datasource.url=jdbc:h2:mem:miconjunto;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=secreto-solo-para-tests-0123456789-abcdefghij
app.jwt.expiracion-horas=8
app.security.enforce=true
app.cors.origins=
app.login.max-intentos=5
app.login.ventana-segundos=60
