# Configuracion de tests. Esta en config/ a proposito: Spring carga primero el
# application.properties real (src/main/resources) y despues este, que solo
# reemplaza lo que define aqui. Asi los tests usan la misma configuracion que
# produccion (open-in-view, compresion, actuator, pool...) salvo la base y los secretos.

# Base de datos H2 en memoria, nunca la de Supabase
spring.datasource.url=jdbc:h2:mem:miconjunto;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# Las migraciones se prueban contra Postgres real en MigracionesPostgresTest
spring.flyway.enabled=false

# Permite contar consultas SQL en RendimientoConsultasTest
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

app.jwt.secret=secreto-solo-para-tests-0123456789-abcdefghij
app.security.enforce=true
